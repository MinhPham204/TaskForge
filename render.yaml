services:
  - type: web
    name: taskforge-api
    runtime: docker
    plan: starter
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: node ./node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8001"
      - key: CLIENT_URL
        sync: false
      # PostgreSQL connection string. Migrations run through preDeployCommand.
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SSL
        value: "true"
      - key: POSTGRES_SYNCHRONIZE
        value: "false"
      # Upstash / private Redis URL. URL takes precedence over individual host fields.
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_VERIFIED_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_VERIFIED_EXPIRES_IN
        value: 5m
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # Frontend static web deployment
  - type: web
    name: taskforge-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
