name: taskforge-postgres-test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: taskforge_test
      POSTGRES_USER: taskforge_test
      POSTGRES_PASSWORD: taskforge_test
    ports:
      - '54330:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskforge_test -d taskforge_test']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.2.14-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: ghcr.io/coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: taskforge-minio-test
      MINIO_ROOT_PASSWORD: taskforge-minio-test-secret
    ports:
      - '9002:9000'
    volumes:
      - minio_test_data:/data

volumes:
  postgres_test_data:
  minio_test_data:
